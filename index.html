<!DOCTYPE html>
<html>
<head>
<title>Matrix Web Generator</title>
<style>
body{font-family:Arial;display:flex;margin:0}
.left{width:360px;padding:20px;background:#f5f5f5;height:100vh;overflow:auto}
.right{flex:1;padding:20px;background:white}
input,textarea{width:100%;margin:5px 0 15px;padding:8px;box-sizing:border-box}
label{font-weight:bold;font-size:13px}
button{padding:12px;width:100%;background:black;color:white;border:none;cursor:pointer;margin-top:10px;font-weight:bold}
.preview{border:2px solid #222;min-height:600px}
.costBox{margin-top:15px;font-size:12px;background:white;padding:10px;border:1px solid #ccc;line-height:1.6}
</style>
</head>
<body>
<div class="left">
<h2>Matrix Web Builder</h2>

<label>Shop Name</label>
<input id="shopName" value="DayToday">

<label>Tagline (no £ sign here)</label>
<input id="tagline" value="Shop Local, Save More">

<label>About Text</label>
<textarea id="about" rows="4">Your local convenience store in Denny, open 7 days a week.</textarea>

<label style="font-weight:normal;display:flex;gap:8px;align-items:center;">
<input type="checkbox" id="bookingToggle" style="width:auto;"> Add Booking System (+£10/month)
</label>

<label style="font-weight:normal;display:flex;gap:8px;align-items:center;">
<input type="checkbox" id="aiToggle" style="width:auto;"> Add AI Assistant (+£20/month)
</label>

<label>Button Text</label>
<input id="buttonText" value="Book Now">

<button onclick="generate()">Generate Preview</button>
<button onclick="download()" style="background:#0a7;">Download HTML</button>

<div class="costBox">
<b>Pricing:</b><br>
Base Site: £100 + £20/year<br>
+ Booking: +£10/month<br>
+ AI: +£20/month<br><br>
Example: Shop with Booking + AI = £100 + £20/year + £30/month
</div>
</div>

<div class="right">
<div id="preview" class="preview"></div>
</div>

<script>
let finalHTML="";
function generate(){
 const name=document.getElementById('shopName').value;
 let tag=document.getElementById('tagline').value.replace(/£/g,'');
 const about=document.getElementById('about').value;
 const btnText=document.getElementById('buttonText').value.replace(/£/g,'');
 const hasBooking=document.getElementById('bookingToggle').checked;
 const hasAI=document.getElementById('aiToggle').checked;

 let bookingHTML="";
 if(hasBooking){
   bookingHTML=`<div style="padding:30px;background:#fff3cd;text-align:center;border-top:1px solid #eee;"><h3>Online Booking</h3><p>Reserve your slot today</p><button style="padding:12px 24px;background:black;color:white;border:none;">${btnText}</button></div>`;
 }

 let aiHTML="";
 if(hasAI){
   aiHTML=`<div style="padding:30px;background:#e3f2fd;text-align:center;border-top:1px solid #eee;"><h3>AI Assistant</h3><p>Ask our AI about opening times, products & more - 24/7</p><div style="background:white;max-width:400px;margin:15px auto;padding:10px;border-radius:20px;border:1px solid #ccc;text-align:left;">Hi! How can I help you today?</div></div>`;
 }

 let priceText="Powered by Matrix Web - £20/year";
 if(hasBooking) priceText+=" + £10/month Booking";
 if(hasAI) priceText+=" + £20/month AI";

 finalHTML=`<div style="font-family:Arial;">
   <div style="background:#d32f2f;color:white;padding:50px 20px;text-align:center;"><h1 style="margin:0;font-size:48px;">${name}</h1><p style="font-size:18px;">${tag}</p></div>
   <div style="padding:40px 20px;text-align:center;max-width:600px;margin:0 auto;"><h2>About Us</h2><p style="line-height:1.6;">${about}</p></div>
   ${bookingHTML}
   ${aiHTML}
   <div style="background:#222;color:#aaa;padding:15px;text-align:center;font-size:11px;">${priceText}</div>
 </div>`;

 document.getElementById('preview').innerHTML=finalHTML;
}
function download(){
 if(!finalHTML){alert('Click Generate Preview first');return;}
 const blob=new Blob([finalHTML],{type:'text/html'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='index.html';
 a.click();
}
generate();
</script>
</body>
</html>
