<!DOCTYPE html>
<html>
<head>
<title>Matrix Web Generator</title>
<style>
body { font-family: Arial; display: flex; }
.left { width: 350px; padding: 20px; background: #f5f5f5; }
.right { flex: 1; padding: 20px; }
input, textarea { width: 100%; margin: 5px 0 15px; padding: 8px; }
label { font-weight: bold; font-size: 14px; }
button { padding: 10px; width: 100%; background: black; color: white; border: none; cursor: pointer; margin-top: 10px; }
.preview { border: 2px solid black; padding: 0; }
</style>
</head>
<body>

<div class="left">
<h2>Matrix Web Builder</h2>

<label>Shop Name</label>
<input id="shopName" value="DayToday">

<label>Tagline</label>
<input id="tagline" value="Shop Local, Save More">

<label>About Text</label>
<textarea id="about">Your local convenience store in Denny, open 7 days.</textarea>

<label><input type="checkbox" id="bookingToggle"> Add Booking System (+ £10/month)</label>

<label>Main Button Text (no £ sign)</label>
<input id="buttonText" value="Book Now">

<button onclick="generate()">Generate Preview</button>
<button onclick="download()" style="background: #0a7;">Download HTML</button>

<p style="font-size:12px; margin-top:20px;">Base: £100 + £20/year<br><span id="priceLabel">With Booking: £100 + £10/month + £20/year</span></p>
</div>

<div class="right">
<div id="preview" class="preview"></div>
</div>

<script>
let finalHTML = "";

function generate(){
 const name = document.getElementById('shopName').value;
 const tag = document.getElementById('tagline').value;
 const about = document.getElementById('about').value;
 const btnText = document.getElementById('buttonText').value;
 const hasBooking = document.getElementById('bookingToggle').checked;

 let bookingHTML = "";
 if(hasBooking){
   bookingHTML = `<div style="padding:20px; background:#fff3cd; text-align:center;"><h3>Online Booking</h3><p>Book your slot now</p><button style="padding:12px 24px; background:black; color:white; border:none;">${btnText}</button></div>`;
 } else {
   bookingHTML = `<div style="padding:20px; text-align:center;"><button style="padding:12px 24px; background:#d32f2f; color:white; border:none;">${btnText}</button></div>`;
 }

 finalHTML = `
 <div style="font-family:Arial;">
   <div style="background:#d32f2f; color:white; padding:40px; text-align:center;">
     <h1 style="margin:0;">${name}</h1>
     <p>${tag}</p>
   </div>
   <div style="padding:30px; text-align:center;">
     <h2>About Us</h2>
     <p>${about}</p>
   </div>
   ${bookingHTML}
   <div style="background:#222; color:white; padding:15px; text-align:center; font-size:12px;">
     Powered by Matrix Web - Base Package 20 per year ${hasBooking ? '+ Booking 10 per month' : ''}
   </div>
 </div>
 `;
 document.getElementById('preview').innerHTML = finalHTML;
}

function download(){
 if(!finalHTML){ alert('Hit Generate first'); return; }
 const blob = new Blob([finalHTML], {type: 'text/html'});
 const a = document.createElement('a');
 a.href = URL.createObjectURL(blob);
 a.download = 'index.html';
 a.click();
}

generate();
</script>
</body>
</html>
